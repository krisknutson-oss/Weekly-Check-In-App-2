<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Safeguard against browser extension conflicts (e.g. MetaMask / Web3 wallets attempting to redefine window.ethereum)
      (function() {
        try {
          var originalDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            if (obj === window && prop === 'ethereum') {
              try {
                return originalDefineProperty.call(this, obj, prop, Object.assign({}, descriptor, { configurable: true, writable: true }));
              } catch (e) {
                // If it still fails, assign directly if possible
                try {
                  if (descriptor && 'value' in descriptor) {
                    obj[prop] = descriptor.value;
                  }
                } catch (_) {}
                return obj;
              }
            }
            return originalDefineProperty.call(this, obj, prop, descriptor);
          };

          window.addEventListener('error', function(event) {
            if (event && event.message && (
              event.message.indexOf('ethereum') !== -1 ||
              event.message.indexOf('Cannot redefine property: ethereum') !== -1
            )) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            if (event && event.reason && String(event.reason).indexOf('ethereum') !== -1) {
              event.preventDefault();
            }
          });
        } catch (_) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Weekly Ledger</title>
    <meta name="description" content="Classroom progress tracker that transforms weekly slide decks into 20-question check-in quizzes with student PIN logins and class analytics." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Zilla+Slab:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
